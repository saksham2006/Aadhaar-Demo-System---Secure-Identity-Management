<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .test-form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            color: #374151;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            display: block;
        }
        
        .form-group input,
        .form-group select {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white !important;
            color: #111827 !important;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            line-height: 1.5;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4facfe !important;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            background: white !important;
            color: #111827 !important;
        }
        
        .form-group input::placeholder {
            color: #6b7280 !important;
            opacity: 1 !important;
        }
        
        .debug-display {
            background: #f0f9ff;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 0.8rem;
            border: 1px solid #3b82f6;
        }
        
        .debug-display pre {
            margin: 0.5rem 0;
            color: #1e40af;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-form">
        <h2>Form Input Test</h2>
        <p>Type in the fields below to test visibility:</p>
        
        <div class="form-group">
            <label for="test-name">Full Name:</label>
            <input 
                type="text" 
                id="test-name" 
                placeholder="Enter your name"
                oninput="updateDebug()"
            />
        </div>
        
        <div class="form-group">
            <label for="test-age">Age:</label>
            <input 
                type="number" 
                id="test-age" 
                placeholder="Enter your age"
                oninput="updateDebug()"
            />
        </div>
        
        <div class="form-group">
            <label for="test-gender">Gender:</label>
            <select id="test-gender" onchange="updateDebug()">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="debug-display">
            <strong>Form Values (Real-time):</strong>
            <pre id="debug-output">Name: 
Age: 
Gender: </pre>
        </div>
        
        <div style="margin-top: 1rem; padding: 1rem; background: #dbeafe; border-radius: 8px;">
            <strong>✅ If you can see this text and type in the fields above, the styling is working!</strong>
            <br><br>
            <strong>❌ If you can't see what you're typing, there's a CSS issue.</strong>
        </div>
    </div>
    
    <script>
        function updateDebug() {
            const name = document.getElementById('test-name').value;
            const age = document.getElementById('test-age').value;
            const gender = document.getElementById('test-gender').value;
            
            document.getElementById('debug-output').textContent = 
                `Name: ${name}\nAge: ${age}\nGender: ${gender}`;
        }
    </script>
</body>
</html>
